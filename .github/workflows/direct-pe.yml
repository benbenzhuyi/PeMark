name: Direct-PE validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Deterministic Direct-PE build
        run: python tools/build_current.py
      - name: Execute emitted-machine-code regressions
        run: python tools/test_v8_5_1.py src/current/generate_markdown_editor_v8_6_1.py
      - name: Inspect generated PE
        run: python tools/inspect_pe.py bin/current/pemark_x64_v8_6_1.exe
      - name: Verify release hash
        shell: pwsh
        run: |
          $expected = "ABD79DE90999A70F3B5328C63CB73109EA0A38CAC85C5ED59F197CAB397AC4BC"
          $actual = (Get-FileHash -Algorithm SHA256 bin/current/pemark_x64_v8_6_1.exe).Hash
          if ($actual -ne $expected) { throw "SHA-256 mismatch: $actual" }
      - name: Build and inspect the development channel
        if: ${{ hashFiles('src/candidate/generate_markdown_editor_v8_6.py') != '' }}
        run: |
          python src/candidate/generate_markdown_editor_v8_6.py
          python tools/test_v8_5_1.py src/candidate/generate_markdown_editor_v8_6.py
          python tools/inspect_pe.py bin/candidate/pemark_x64_v8_6_candidate.exe
      - name: Exercise document-safety, encoding and capacity gates
        if: ${{ hashFiles('tools/test_v8_5_2_destructive.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: |
          python tools/test_v8_5_2_revision.py
          python tools/test_v8_5_2_open_encoding.py
          python tools/test_v8_5_2_write_injection.py
          python tools/test_v8_5_2_destructive.py
          python tools/test_v8_5_2_capacity_baseline.py
          python tools/test_v8_5_2_outline_alloc_injection.py
          python tools/test_v8_5_2_style_alloc_injection.py
          python tools/test_v8_5_2_style_capacity.py
          python tools/smoke_test_v8_5_1.py bin/candidate/pemark_x64_v8_6_candidate.exe
      - name: Exercise arena and memory gates
        if: ${{ hashFiles('tools/test_v8_5_3_document_arena.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: |
          python tools/test_v8_5_3_render_arena.py
          python tools/test_v8_5_3_document_arena.py
          python tools/test_v8_5_3_scratch_arenas.py
          python tools/test_v8_5_3_memory_plateau.py
      - name: Exercise PE structure gates
        if: ${{ hashFiles('tools/test_v8_5_4_sections.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: |
          python tools/test_v8_5_4_sections.py
          python tools/test_v8_5_4_unwind.py
      - name: Exercise workspace enumeration
        if: ${{ hashFiles('tools/test_v8_6_workspace_enum.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: python tools/test_v8_6_workspace_enum.py
      - name: Exercise sidebar panel modes
        if: ${{ hashFiles('tools/test_v8_6_panel.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: python tools/test_v8_6_panel.py
      - name: Exercise the custom title row and icons
        if: ${{ hashFiles('tools/test_v8_6_caption.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: python tools/test_v8_6_caption.py
      - name: Exercise list navigation and file opening
        if: ${{ hashFiles('tools/test_v8_6_navigation.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: python tools/test_v8_6_navigation.py
      - name: Exercise the keymap
        if: ${{ hashFiles('tools/test_v8_6_keymap.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/candidate/generate_markdown_editor_v8_6.py
          PEMARK_EXE: ${{ github.workspace }}/bin/candidate/pemark_x64_v8_6_candidate.exe
        run: python tools/test_v8_6_keymap.py
