name: Direct-PE validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Deterministic Direct-PE build
        run: python tools/build_current.py
      - name: Execute emitted-machine-code regressions
        run: python tools/test_v8_5_1.py src/current/generate_markdown_editor_v8_5_2.py
      - name: Inspect generated PE
        run: python tools/inspect_pe.py bin/current/pemark_x64_v8_5_2.exe
      - name: Verify release hash
        shell: pwsh
        run: |
          $expected = "2C105660DBAC96B7DE18614F43753073B3B5613E22BBA160CEB8058646040E30"
          $actual = (Get-FileHash -Algorithm SHA256 bin/current/pemark_x64_v8_5_2.exe).Hash
          if ($actual -ne $expected) { throw "SHA-256 mismatch: $actual" }
      - name: Build and inspect the next candidate when present
        if: ${{ hashFiles('src/candidate/generate_markdown_editor_v8_5_3.py') != '' }}
        run: |
          python src/candidate/generate_markdown_editor_v8_5_3.py
          python tools/test_v8_5_1.py src/candidate/generate_markdown_editor_v8_5_3.py
          python tools/inspect_pe.py bin/candidate/pemark_x64_v8_5_3_candidate.exe
      - name: Exercise V8.5.2 document-safety gates
        if: ${{ hashFiles('tools/test_v8_5_2_destructive.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/current/generate_markdown_editor_v8_5_2.py
          PEMARK_EXE: ${{ github.workspace }}/bin/current/pemark_x64_v8_5_2.exe
        run: |
          python tools/test_v8_5_2_revision.py
          python tools/test_v8_5_2_open_encoding.py
          python tools/test_v8_5_2_write_injection.py
          python tools/test_v8_5_2_destructive.py
      - name: Exercise V8.5.2 capacity gates
        if: ${{ hashFiles('tools/test_v8_5_2_capacity_baseline.py') != '' }}
        env:
          PEMARK_GENERATOR: ${{ github.workspace }}/src/current/generate_markdown_editor_v8_5_2.py
          PEMARK_EXE: ${{ github.workspace }}/bin/current/pemark_x64_v8_5_2.exe
        run: |
          python tools/test_v8_5_2_capacity_baseline.py
          python tools/test_v8_5_2_outline_alloc_injection.py
          python tools/test_v8_5_2_style_alloc_injection.py
          python tools/test_v8_5_2_style_capacity.py
      - name: Exercise V8.5.3 render arena when present
        if: ${{ hashFiles('tools/test_v8_5_3_render_arena.py') != '' }}
        run: python tools/test_v8_5_3_render_arena.py
      - name: Exercise V8.5.3 document arena when present
        if: ${{ hashFiles('tools/test_v8_5_3_document_arena.py') != '' }}
        run: python tools/test_v8_5_3_document_arena.py
      - name: Exercise V8.5.3 scratch arenas when present
        if: ${{ hashFiles('tools/test_v8_5_3_scratch_arenas.py') != '' }}
        run: python tools/test_v8_5_3_scratch_arenas.py
      - name: Observe the V8.5.3 memory plateau when present
        if: ${{ hashFiles('tools/test_v8_5_3_memory_plateau.py') != '' }}
        run: python tools/test_v8_5_3_memory_plateau.py
